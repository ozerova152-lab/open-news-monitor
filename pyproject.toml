[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-news-monitor"
version = "0.1.0"
description = "Self-hosted news monitoring, RSS alerts, and source-linked digests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]
license = {text = "MIT"}
authors = [{name = "Open News Monitor contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
sheets = ["google-api-python-client>=2.0", "google-auth>=2.0"]
dev = []

[project.scripts]
open-news-monitor = "open_news_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_news_monitor = ["catalog/*.json"]
